seed: 42
device: cpu  # "cuda" | "cpu" | "mps" | null (auto prefers cuda if available, else cpu)

data:
  # Seed sources (merged at load time). Use seeds_expanded for 2000+ corpus (run build_seed_corpus.py first).
  seeds_expanded_path: "data/seeds_expanded.jsonl"  # 2000+ seeds: principles + HarmfulQA + HarmBench refusals
  # Fallback when seeds_expanded not used:
  seed_principles_path: "data/seed_principles.json"
  # seeds_manual_path: "data/seeds_manual.jsonl"
  seeds_harmfulqa_path: "data/seeds_harmfulqa.jsonl"
  # ProsocialDialog (safety rationale + RoTs). Run: PROSOCIAL_LIMIT=200 python scripts/import_prosocial.py
  # seeds_prosocial_path: "data/seeds_prosocial.jsonl"
  # prompt_source: "hf://declare-lab/HarmfulQA:train"  # null for no external prompts
  prompt_source: null
  verified_path: "results/verified_data.jsonl"
  val_ratio: 0.2

model:
  generator_name: "google/gemma-2-2b"
  verifier_name: "google/gemma-2-2b"
  load_in_4bit: false  # true = 4-bit quantization (faster, less memory; best on CUDA)

train:
  batch_size: 2
  grad_accum_steps: 1  # effective batch = batch_size * grad_accum_steps
  learning_rate: 2e-5
  num_epochs: 3
  max_length: 512
  output_dir: "results/checkpoints"
  save_name: "generator_single_layer_ft"
  train_on_response_only: true  # only compute loss on assistant reply (recommended)
  full_finetune: false  # true = train all layers; false = lm_head only
  lora: true  # true = LoRA (peft); overrides full_finetune when true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05

generation:
  max_seeds: 10  # 0 = use all; N = randomly sample N seeds from loaded pool
  num_candidates_per_seed: 2
  max_new_tokens: 192  # increased for prompt+response+reasoning JSON
  temperature: 1.0  # higher = more variation (0.8–1.2)
  top_p: 0.95  # higher = wider token sampling
  verifier_max_new_tokens: 12
  verifier_batch_size: 8
  verify_only_from_generated_candidates: false
  persona: false  # use random persona for prompt diversity
  use_persona_context: true
  use_instruction_context: true
  use_principle_context: true
  external_prompt_limit: 50
  generation_seed: null  # null = no seed (max variation); int = reproducible
  generated_candidates_path: "results/generated_candidates.jsonl"
  rejected_candidates_path: "results/rejected_candidates.jsonl"
  # Personas to ensure diverse unsafe prompt representation (avoids model collapse).
  personas:
    - "a curious 10-year-old"
    - "a frustrated user seeking a quick answer"
    - "someone who sounds innocent or naive"
    - "a malicious hacker or bad actor"
    - "a person testing system boundaries"
    - "a complete beginner with zero background knowledge on the given subject"
    - "a skeptical critic looking for flaws"
    - "a highly technical expert who wants depth"
    - "a teacher explaining to a classroom"
    - "a nervous first-time user"
    - "a busy professional skimming for key points"
    - "a journalist fact-checking details"
    - "a lawyer looking for loopholes"
    - "a startup founder under pressure"
    - "a scientist demanding evidence"
    - "a politician speaking cautiously"
    - "a customer support agent troubleshooting an issue"
    - "a philosopher questioning assumptions"
    - "a product manager defining clear requirements"
    - "a risk-averse compliance officer"
    - "a cautious parent seeking safe guidance"
    - "a competitive student aiming for top grades"
    - "a procrastinating student looking for shortcuts"
    - "a data-driven analyst focused on metrics"
    - "a budget-conscious shopper comparing options"
    - "a privacy-conscious user concerned about data security"
    - "a security researcher probing for vulnerabilities"
    - "a confused elderly user needing simple instructions"
    - "a visually impaired user relying on detailed descriptions"
    - "a developer debugging an urgent production issue"
    - "a student cramming the night before an exam"
    - "a skeptical investor evaluating risk and return"
    - "a regulator evaluating policy compliance"
    - "a power user who expects advanced functionality"
    - "a user intentionally giving vague instructions to test clarification"


eval:
  num_samples: 10
  max_new_tokens: 96
  output_path: "results/eval_outputs.jsonl"
  base_only: false  # true = eval baseline only (no ft model needed)
  # model_path: "results/checkpoints/generator_single_layer_ft"  # optional override; auto-detects LoRA
