seed: 42
device: null  # "mps" | "cuda" | "cpu" | null(auto)

data:
  seed_pivots_path: "data/seed_pivots.jsonl"
  prompt_source: "hf://declare-lab/HarmfulQA:train"  # or local .jsonl path
  verified_path: "results/verified_data.jsonl"
  val_ratio: 0.2

model:
  generator_name: "google/gemma-2-2b"
  verifier_name: "google/gemma-2-2b"

train:
  batch_size: 4

generation:
  num_candidates_per_seed: 3
  max_new_tokens: 220
  temperature: 0.6
  top_p: 0.9
  verifier_max_new_tokens: 12
  verify_only_from_generated_candidates: false
  allow_unstructured_fallback: false
  external_prompt_limit: 50
  external_prompt_shuffle: true
  external_prompt_streaming: true
  external_prompt_shuffle_buffer: 1000
  generated_candidates_path: "results/generated_candidates.jsonl"
  rejected_candidates_path: "results/rejected_candidates.jsonl"
